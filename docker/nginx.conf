# Nginx in front of PHP-FPM (service "app").
server {
    listen 8080;
    server_name _;
    root /srv/apps/platform/public;
    index index.php;

    client_max_body_size 30m;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/apps/platform/public$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";

        # Laravel sends large headers (asset preload Link, session and XSRF
        # cookies); the default 4-8k header buffer answers 502...
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 16k;

        # Server-sent events (AI chat) must not be buffered.
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
