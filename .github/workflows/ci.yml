name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    platform:
        name: PHP + Vue (PostgreSQL ${{ matrix.postgres }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4']
                postgres: ['0.8.1-pg17']

        services:
            postgres:
                image: pgvector/pgvector:${{ matrix.postgres }}
                env:
                    POSTGRES_DB: starter_testing
                    POSTGRES_USER: starter
                    POSTGRES_PASSWORD: secret
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U starter -d starter_testing"
                    --health-interval 5s --health-timeout 5s --health-retries 20

        env:
            DB_HOST: 127.0.0.1
            DB_USERNAME: starter
            DB_PASSWORD: secret

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo_pgsql, intl, zip, bcmath
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'

            - name: Enable pnpm
              run: corepack enable

            - name: Validate composer.json
              run: composer validate --working-dir=apps/platform --no-check-publish

            - name: Install PHP dependencies
              run: composer install --working-dir=apps/platform --no-interaction --prefer-dist

            - name: Audit PHP dependencies
              run: composer audit --working-dir=apps/platform

            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare environment
              working-directory: apps/platform
              run: |
                  cp .env.example .env
                  php artisan key:generate
                  php -r "file_put_contents('.env', str_replace('DB_DATABASE=starter', 'DB_DATABASE=starter_testing', file_get_contents('.env')));"
                  php artisan migrate --force

            - name: Build assets
              run: pnpm build

            - name: Lint PHP (Pint)
              working-directory: apps/platform
              run: composer lint:check

            - name: Static analysis (PHPStan/Larastan)
              working-directory: apps/platform
              run: composer types:check

            - name: Lint and format front-end
              run: pnpm check

            - name: Type check Vue
              run: pnpm types:check

            - name: Front-end unit tests
              run: pnpm test

            - name: PHP tests
              working-directory: apps/platform
              run: php artisan test

            - name: Starter verification (doctor, config, contracts, migrations, permissions)
              working-directory: apps/platform
              run: |
                  php artisan starter:permissions
                  php artisan starter:verify

            - name: Stack manifest is up to date
              working-directory: apps/platform
              run: php artisan starter:manifest --check || echo "::warning::starter.manifest.json differs from the CI environment"

            - name: Docker Compose configurations
              run: |
                  for profiles in "" "--profile local-db --profile dev-mail" "--profile rag-db" "--profile postgrest" "--profile inertia-ssr"; do
                    docker compose -f docker/compose.yaml -f docker/compose.dev.yaml $profiles config --quiet
                    docker compose -f docker/compose.yaml -f docker/compose.local.yaml $profiles config --quiet
                    docker compose -f docker/compose.yaml -f docker/compose.production.yaml $profiles config --quiet
                  done
                  DB_PASSWORD=ci docker compose -f docker/compose.dokploy.yaml config --quiet

    installer:
        name: Installer (laravel-starter new)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: pgvector/pgvector:0.8.1-pg17
                env:
                    POSTGRES_DB: demo
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: secret
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres -d demo"
                    --health-interval 5s --health-timeout 5s --health-retries 20

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, intl, zip, bcmath, phar
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'

            - name: Enable pnpm
              run: corepack enable

            - name: Install the installer (standalone package)
              run: composer install --working-dir=tooling/create-starter --no-interaction --prefer-dist

            - name: Create a project from this checkout with an external database
              env:
                  DEMO_DB_URL: pgsql://postgres:secret@127.0.0.1:5432/demo
              run: |
                  jq '.database = {"mode": "external", "ref": "env:DEMO_DB_URL"}
                      | .features.rag = true
                      | .rag = {"mode": "internal", "embeddingProfileRef": "default"}
                      | .ai = {"connectionRef": "local", "connections": [{"ref": "local", "driver": "simulated"}], "agent": {"systemPrompt": "Assistant of the CI project.", "modelRef": "simulated-chat"}}
                      | .mail = {"transport": "log", "from": "ci@example.com"}' \
                      starter.config.example.json > "$RUNNER_TEMP/starter.config.json"
                  php tooling/create-starter/bin/laravel-starter new "$RUNNER_TEMP/demo" \
                      --template=. --config="$RUNNER_TEMP/starter.config.json" --no-interaction --json | tee "$RUNNER_TEMP/install.json"
                  test "$(jq -r .ok "$RUNNER_TEMP/install.json")" = "true"

            - name: The installed project is healthy
              working-directory: ${{ runner.temp }}/demo/apps/platform
              run: |
                  php artisan starter:doctor
                  php artisan starter:verify --skip-contracts
                  php artisan starter:config-apply ../../starter.config.json --dry-run

    setup-local:
        name: One-command setup (local)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: pgvector/pgvector:0.8.1-pg17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: secret
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s --health-timeout 5s --health-retries 20

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, intl, zip, bcmath
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'

            - name: ./setup.sh --local (creates the database, owner, build, doctor)
              run: |
                  ./setup.sh --local --owner=ci@example.com --name="CI" \
                      --db-url=postgresql://postgres:secret@127.0.0.1:5432/setup_ci --json | tee "$RUNNER_TEMP/setup.json"
                  test "$(tail -n 1 "$RUNNER_TEMP/setup.json" | jq -r .status)" = "ready"

            - name: Re-running is safe
              run: ./setup.sh --local --skip-build --json | tail -n 1 | jq -e '.status == "ready"'

    docker:
        name: Docker image and one-command setup
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Build app image
              run: docker build -f docker/app.Dockerfile --target app -t starter-app:ci .

            - name: Build web image
              run: docker build -f docker/app.Dockerfile --target web -t starter-web:ci .

            - name: ./setup.sh --docker (PostgreSQL, Mailpit, migrations, owner, doctor)
              run: |
                  ./setup.sh --docker --owner=ci@example.com --json | tee "$RUNNER_TEMP/setup.json"
                  test "$(tail -n 1 "$RUNNER_TEMP/setup.json" | jq -r .status)" = "ready"

            - name: The login page, the assets and Mailpit answer
              run: |
                  curl -fsS -o /dev/null http://localhost:8080/login
                  curl -fsS -o /dev/null "http://localhost:8080/build/manifest.json"
                  curl -fsS http://localhost:8025/api/v1/info | jq -e '.Version'

            - name: Service logs
              if: failure()
              run: docker compose -f docker/compose.yaml -f docker/compose.local.yaml --profile local-db --profile dev-mail logs --tail=200
