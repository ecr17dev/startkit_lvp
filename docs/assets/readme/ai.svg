<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" width="960" height="352" role="img" aria-labelledby="title desc">
<title id="title">Ciclo de una llamada a IA</title>
<desc id="desc">Una llamada pasa por el agente publicado, AiGateway que valida y estima, la reserva de presupuesto, laravel/ai y el libro de consumo. Las herramientas sensibles crean una propuesta que el usuario confirma antes de ejecutar la misma Action del panel.</desc>
<style>
svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d8dee4;--ink:#1f2328;--muted:#59636e;--soft:#8c959f;--tint:.09;
--laravel:#f0503c;--vue:#10b981;--pg:#3b82f6;--ai:#8b5cf6;--mail:#f59e0b;--ops:#14b8a6;--slate:#64748b;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--soft:#656c76;--tint:.16}}
.card{fill:var(--bg);stroke:var(--line)}
.panel{fill:var(--panel);stroke:var(--line);stroke-dasharray:4 4}
.h{font-size:15px;font-weight:700;fill:var(--ink)}
.t{font-size:14px;font-weight:650;fill:var(--ink)}
.s{font-size:12px;fill:var(--muted)}
.cap{font-size:11px;font-weight:700;letter-spacing:.14em;fill:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.node{fill:var(--c);fill-opacity:var(--tint);stroke:var(--c);stroke-width:1.4;stroke-opacity:.85}
.bar{fill:var(--c)}
.dot{fill:var(--c)}
.flow{fill:none;stroke:var(--soft);stroke-width:1.5;stroke-dasharray:5 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.head{fill:var(--soft)}
.pk{fill:var(--c)}
.glow{animation:glow 3.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.flow,.glow{animation:none}.pk,.motion{display:none}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="card" x="0.5" y="0.5" width="959" height="351" rx="16"/>
<path class="flow" d="M202,98.0 L216,98.0" marker-end="url(#arrow)"/>
<path class="flow" d="M382,98.0 L396,98.0" marker-end="url(#arrow)"/>
<path class="flow" d="M562,98.0 L576,98.0" marker-end="url(#arrow)"/>
<path class="flow" d="M742,98.0 L756,98.0" marker-end="url(#arrow)"/>
<circle class="pk" r="4" style="--c:var(--ai)" cx="0" cy="0"><animateMotion dur="4.0s" begin="0s" repeatCount="indefinite" path="M120.0,98 L840.0,98"/></circle>
<circle class="pk" r="4" style="--c:var(--mail)" cx="0" cy="0"><animateMotion dur="4.0s" begin="-2.0s" repeatCount="indefinite" path="M120.0,98 L840.0,98"/></circle>
<path class="flow" d="M247,240.0 L261,240.0" marker-end="url(#arrow)"/>
<path class="flow" d="M472,240.0 L486,240.0" marker-end="url(#arrow)"/>
<path class="flow" d="M697,240.0 L711,240.0" marker-end="url(#arrow)"/>
<circle class="pk" r="4" style="--c:var(--laravel)" cx="0" cy="0"><animateMotion dur="4.4s" begin="-1.0s" repeatCount="indefinite" path="M142.5,240 L817.5,240"/></circle>
<text class="cap" x="40" y="40">CICLO DE UNA LLAMADA A IA</text>
<g style="--c:var(--ai)">
<rect x="40" y="56" width="160" height="84" rx="12" fill="var(--bg)"/>
<rect class="node" x="40" y="56" width="160" height="84" rx="12"/>
<rect class="bar" x="54" y="71" width="4" height="16" rx="2"/>
<text class="t" x="66" y="84">Chat o agente</text>
<text class="s" x="66" y="104">versión publicada</text>
<text class="s" x="66" y="121">y autorizada</text>
</g>
<g style="--c:var(--ai)">
<rect x="220" y="56" width="160" height="84" rx="12" fill="var(--bg)"/>
<rect class="node" x="220" y="56" width="160" height="84" rx="12"/>
<rect class="bar" x="234" y="71" width="4" height="16" rx="2"/>
<text class="t mono" x="246" y="84">AiGateway</text>
<text class="s" x="246" y="104">valida el modelo</text>
<text class="s" x="246" y="121">estima el costo</text>
</g>
<g style="--c:var(--mail)">
<rect x="400" y="56" width="160" height="84" rx="12" fill="var(--bg)"/>
<rect class="node" x="400" y="56" width="160" height="84" rx="12"/>
<rect class="bar" x="414" y="71" width="4" height="16" rx="2"/>
<text class="t" x="426" y="84">Presupuesto</text>
<text class="s" x="426" y="104">reserva atómica</text>
<text class="s" x="426" y="121">o bloquea la llamada</text>
</g>
<g style="--c:var(--slate)">
<rect x="580" y="56" width="160" height="84" rx="12" fill="var(--bg)"/>
<rect class="node" x="580" y="56" width="160" height="84" rx="12"/>
<rect class="bar" x="594" y="71" width="4" height="16" rx="2"/>
<text class="t mono" x="606" y="84">laravel/ai</text>
<text class="s" x="606" y="104">OpenAI · Anthropic</text>
<text class="s" x="606" y="121">Gemini · Ollama · …</text>
</g>
<g style="--c:var(--pg)">
<rect x="760" y="56" width="160" height="84" rx="12" fill="var(--bg)"/>
<rect class="node" x="760" y="56" width="160" height="84" rx="12"/>
<rect class="bar" x="774" y="71" width="4" height="16" rx="2"/>
<text class="t" x="786" y="84">Libro de consumo</text>
<text class="s" x="786" y="104">tokens y costo real</text>
<text class="s" x="786" y="121">desconocido = null</text>
</g>
<text class="cap" x="40" y="184">HERRAMIENTAS CON CONFIRMACIÓN</text>
<g style="--c:var(--ai)">
<rect x="40" y="198" width="205" height="84" rx="12" fill="var(--bg)"/>
<rect class="node" x="40" y="198" width="205" height="84" rx="12"/>
<rect class="bar" x="54" y="213" width="4" height="16" rx="2"/>
<text class="t" x="66" y="226">El modelo pide</text>
<text class="s" x="66" y="246">una herramienta registrada</text>
<text class="s" x="66" y="263">en ToolRegistry</text>
</g>
<g style="--c:var(--mail)">
<rect x="265" y="198" width="205" height="84" rx="12" fill="var(--bg)"/>
<rect class="node" x="265" y="198" width="205" height="84" rx="12"/>
<rect class="bar" x="279" y="213" width="4" height="16" rx="2"/>
<text class="t" x="291" y="226">Propuesta</text>
<text class="s" x="291" y="246">el chat muestra qué hará</text>
<text class="s" x="291" y="263">y con qué datos</text>
</g>
<g style="--c:var(--vue)">
<rect x="490" y="198" width="205" height="84" rx="12" fill="var(--bg)"/>
<rect class="node" x="490" y="198" width="205" height="84" rx="12"/>
<rect class="bar" x="504" y="213" width="4" height="16" rx="2"/>
<text class="t" x="516" y="226">Confirmas</text>
<text class="s" x="516" y="246">o cancelas;</text>
<text class="s" x="516" y="263">nada corre antes</text>
</g>
<g style="--c:var(--laravel)">
<rect x="715" y="198" width="205" height="84" rx="12" fill="var(--bg)"/>
<rect class="node" x="715" y="198" width="205" height="84" rx="12"/>
<rect class="bar" x="729" y="213" width="4" height="16" rx="2"/>
<text class="t" x="741" y="226">Misma Action</text>
<text class="s" x="741" y="246">que el panel: autoriza,</text>
<text class="s" x="741" y="263">valida y audita</text>
</g>
<text class="s" x="40" y="320">Sin claves responde el proveedor simulado (STARTER_AI_SIMULATED=true) · avisos de presupuesto al 80 % y 100 %</text>
</svg>
