<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4962;0.5002;0.965;1" dur="16.0s" repeatCount="indefinite"/><text class="mono" x="28" y="230" style="font-size:13.5px;font-weight:700" fill="#e6edf3"><tspan fill="#58a6ff">==&gt;</tspan> Database</text></g>
