<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5994;0.6034;0.965;1" dur="16.0s" repeatCount="indefinite"/><text class="mono" x="60" y="296" style="font-size:13.5px" fill="#c9d1d9"><tspan fill="#3fb950">✓</tspan> http://localhost:8080/up answers</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6256;0.6296;0.965;1" dur="16.0s" repeatCount="indefinite"/><text class="mono" x="28" y="318" style="font-size:13.5px;font-weight:700" fill="#e6edf3"><tspan fill="#58a6ff">==&gt;</tspan> Git</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6600;0.6640;0.965;1" dur="16.0s" repeatCount="indefinite"/><text class="mono" x="60" y="340" style="font-size:13.5px" fill="#c9d1d9"><tspan fill="#3fb950">✓</tspan> Git: new history on main (template as remote starter)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6863;0.6903;0.965;1" dur="16.0s" repeatCount="indefinite"/><text class="mono" x="28" y="362" style="font-size:13.5px;font-weight:700" fill="#e6edf3"><tspan fill="#58a6ff">==&gt;</tspan> Ready</text></g>
