<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7469;0.7509;0.965;1" dur="16.0s" repeatCount="indefinite"/><text class="mono" x="60" y="406" style="font-size:13.5px" fill="#c9d1d9"><tspan fill="#3fb950">✓</tspan> Sign in with tu@correo.com: the one-time code arrives at http://localhost:8025</text></g>
