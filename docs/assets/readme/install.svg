<rect class="card" x="0.5" y="0.5" width="959" height="461" rx="16"/>
<rect x="0.5" y="0.5" width="959" height="461" rx="14" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 40.5V14.5a14 14 0 0 1 14-14h931a14 14 0 0 1 14 14V40.5z" fill="#161b22"/>
<line x1="0.5" y1="40.5" x2="959.5" y2="40.5" stroke="#30363d"/>
<circle cx="24" cy="20.5" r="6" fill="#ff5f57"/><circle cx="44" cy="20.5" r="6" fill="#febc2e"/><circle cx="64" cy="20.5" r="6" fill="#28c840"/>
<text x="480" y="25" text-anchor="middle" class="mono" style="font-size:12.5px;fill:#9198a1">~/mi-app — ./setup.sh</text>
<g class="mono" style="font-size:13.5px" clip-path="url(#type0)"><text x="28" y="76" fill="#3fb950">$</text><text x="46" y="76" fill="#e6edf3">git clone --depth 1 https://github.com/bluesmilecl/startkit_laravel.git mi-app</text></g>
<g class="mono" style="font-size:13.5px" clip-path="url(#type1)"><text x="28" y="98" fill="#3fb950">$</text><text x="46" y="98" fill="#e6edf3">cd mi-app &amp;&amp; ./setup.sh --new-project="Mi App" --owner=tu@correo.com</text></g>
<text class="mono" x="60" y="120" style="font-size:13.5px" fill="#9198a1" opacity="0">Mode: docker (force it with --docker or --local)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3406;0.3446;0.965;1" dur="16.0s" repeatCount="indefinite"/></text>
