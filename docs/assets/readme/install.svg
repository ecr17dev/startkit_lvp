<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 462" width="960" height="462" role="img" aria-labelledby="title desc">
<title id="title">Instalación con setup.sh</title>
<desc id="desc">Terminal animada: git clone del starter y ./setup.sh --new-project crea el proyecto con Docker, base de datos, verificación y el acceso del propietario.</desc>
<style>
svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d8dee4;--ink:#1f2328;--muted:#59636e;--soft:#8c959f;--tint:.09;
--laravel:#f0503c;--vue:#10b981;--pg:#3b82f6;--ai:#8b5cf6;--mail:#f59e0b;--ops:#14b8a6;--slate:#64748b;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--soft:#656c76;--tint:.16}}
.card{fill:var(--bg);stroke:var(--line)}
.panel{fill:var(--panel);stroke:var(--line);stroke-dasharray:4 4}
.h{font-size:15px;font-weight:700;fill:var(--ink)}
.t{font-size:14px;font-weight:650;fill:var(--ink)}
.s{font-size:12px;fill:var(--muted)}
.cap{font-size:11px;font-weight:700;letter-spacing:.14em;fill:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.node{fill:var(--c);fill-opacity:var(--tint);stroke:var(--c);stroke-width:1.4;stroke-opacity:.85}
.bar{fill:var(--c)}
.dot{fill:var(--c)}
.flow{fill:none;stroke:var(--soft);stroke-width:1.5;stroke-dasharray:5 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.head{fill:var(--soft)}
.pk{fill:var(--c)}
.glow{animation:glow 3.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.flow,.glow{animation:none}.pk,.motion{display:none}}
</style>
