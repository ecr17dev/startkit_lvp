<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 318" width="960" height="318" role="img" aria-labelledby="title desc">
<title id="title">Despliegue en Dokploy</title>
<desc id="desc">git push a GitHub dispara Auto Deploy en Dokploy, que construye docker/compose.dokploy.yaml: migrate, app, web, queue, scheduler y postgres con pgvector, detrás de Traefik con HTTPS.</desc>
<style>
svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d8dee4;--ink:#1f2328;--muted:#59636e;--soft:#8c959f;--tint:.09;
--laravel:#f0503c;--vue:#10b981;--pg:#3b82f6;--ai:#8b5cf6;--mail:#f59e0b;--ops:#14b8a6;--slate:#64748b;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--soft:#656c76;--tint:.16}}
.card{fill:var(--bg);stroke:var(--line)}
.panel{fill:var(--panel);stroke:var(--line);stroke-dasharray:4 4}
.h{font-size:15px;font-weight:700;fill:var(--ink)}
.t{font-size:14px;font-weight:650;fill:var(--ink)}
.s{font-size:12px;fill:var(--muted)}
.cap{font-size:11px;font-weight:700;letter-spacing:.14em;fill:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.node{fill:var(--c);fill-opacity:var(--tint);stroke:var(--c);stroke-width:1.4;stroke-opacity:.85}
.bar{fill:var(--c)}
.dot{fill:var(--c)}
.flow{fill:none;stroke:var(--soft);stroke-width:1.5;stroke-dasharray:5 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.head{fill:var(--soft)}
.pk{fill:var(--c)}
.glow{animation:glow 3.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.flow,.glow{animation:none}.pk,.motion{display:none}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="card" x="0.5" y="0.5" width="959" height="317" rx="16"/>
<rect class="panel" x="590.5" y="54.5" width="329" height="176" rx="14"/>
<path class="flow" d="M182,129 L202,129" marker-end="url(#arrow)"/>
<path class="flow" d="M358,129 L378,129" marker-end="url(#arrow)"/>
<path class="flow" d="M560,129 L586,129" marker-end="url(#arrow)"/>
<path class="flow" d="M684,248 L684,228" marker-end="url(#arrow)"/>
<circle class="pk" r="4" style="--c:var(--ops)" cx="0" cy="0"><animateMotion dur="3.2s" begin="0s" repeatCount="indefinite" path="M110,129 L586,129"/></circle>
<circle class="pk" r="3.5" style="--c:var(--vue)" cx="0" cy="0"><animateMotion dur="1.8s" begin="-0.4s" repeatCount="indefinite" path="M684,276 L684,228"/></circle>
<text class="cap" x="40" y="40">DESPLIEGUE EN DOKPLOY</text>
<g style="--c:var(--slate)">
<rect x="40" y="92" width="140" height="74" rx="12" fill="var(--bg)"/>
<rect class="node" x="40" y="92" width="140" height="74" rx="12"/>
<rect class="bar" x="54" y="107" width="4" height="16" rx="2"/>
<text class="t mono" x="66" y="120">git push</text>
<text class="s" x="66" y="140">rama del entorno</text>
</g>
<g style="--c:var(--slate)">
<rect x="206" y="92" width="150" height="74" rx="12" fill="var(--bg)"/>
<rect class="node" x="206" y="92" width="150" height="74" rx="12"/>
<rect class="bar" x="220" y="107" width="4" height="16" rx="2"/>
<text class="t" x="232" y="120">GitHub</text>
<text class="s" x="232" y="140">Auto Deploy</text>
</g>
<g style="--c:var(--ops)">
<rect x="382" y="92" width="176" height="74" rx="12" fill="var(--bg)"/>
<rect class="node" x="382" y="92" width="176" height="74" rx="12"/>
<rect class="bar" x="396" y="107" width="4" height="16" rx="2"/>
<text class="t" x="408" y="120">Dokploy</text>
<text class="s" x="408" y="140">build de la imagen</text>
<text class="s" x="408" y="157">compose.dokploy.yaml</text>
</g>
<text class="cap" x="608" y="78">SERVICIOS (AISLADOS)</text>
<g style="--c:var(--laravel)"><rect x="606" y="88" width="144" height="40" rx="9" fill="var(--bg)"/><rect class="node" x="606" y="88" width="144" height="40" rx="9"/><text class="t mono" x="618" y="105" style="font-size:12.5px">migrate</text><text class="s" x="618" y="120" style="font-size:11px">permisos y seed</text></g>
<g style="--c:var(--laravel)"><rect x="762" y="88" width="144" height="40" rx="9" fill="var(--bg)"/><rect class="node" x="762" y="88" width="144" height="40" rx="9"/><text class="t mono" x="774" y="105" style="font-size:12.5px">app</text><text class="s" x="774" y="120" style="font-size:11px">PHP-FPM</text></g>
<g style="--c:var(--vue)"><rect x="606" y="134" width="144" height="40" rx="9" fill="var(--bg)"/><rect class="node" x="606" y="134" width="144" height="40" rx="9"/><text class="t mono" x="618" y="151" style="font-size:12.5px">web</text><text class="s" x="618" y="166" style="font-size:11px">Nginx :8080</text></g>
<g style="--c:var(--ops)"><rect x="762" y="134" width="144" height="40" rx="9" fill="var(--bg)"/><rect class="node" x="762" y="134" width="144" height="40" rx="9"/><text class="t mono" x="774" y="151" style="font-size:12.5px">queue</text><text class="s" x="774" y="166" style="font-size:11px">cola de trabajos</text></g>
<g style="--c:var(--ops)"><rect x="606" y="180" width="144" height="40" rx="9" fill="var(--bg)"/><rect class="node" x="606" y="180" width="144" height="40" rx="9"/><text class="t mono" x="618" y="197" style="font-size:12.5px">scheduler</text><text class="s" x="618" y="212" style="font-size:11px">tareas programadas</text></g>
<g style="--c:var(--pg)"><rect x="762" y="180" width="144" height="40" rx="9" fill="var(--bg)"/><rect class="node" x="762" y="180" width="144" height="40" rx="9"/><text class="t mono" x="774" y="197" style="font-size:12.5px">postgres</text><text class="s" x="774" y="212" style="font-size:11px">con pgvector</text></g>
<g style="--c:var(--ops)">
<rect x="590" y="250" width="330" height="52" rx="12" fill="var(--bg)"/>
<rect class="node" x="590" y="250" width="330" height="52" rx="12"/>
<rect class="bar" x="604" y="265" width="4" height="16" rx="2"/>
<text class="t" x="616" y="278">Traefik · HTTPS con Let's Encrypt</text>
</g>
<text class="s mono" x="616" y="292" style="font-size:12px">https://tu-dominio</text>
<text class="s" x="40" y="214">Secretos solo en el entorno de Dokploy (nunca en el repo).</text>
<text class="s" x="40" y="234">Un servicio por proyecto y entorno · migraciones antes de</text>
<text class="s" x="40" y="254">levantar la app · la skill deploy-dokploy lo hace con el MCP.</text>
</svg>
