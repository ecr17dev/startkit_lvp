<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
<title id="title">Laravel Starter</title>
<desc id="desc">Starter kit de Laravel 13 con IA lista para producción: agentes y costos, RAG con citas, correo automático, roles y auditoría, API con cliente TypeScript y kit de UI.</desc>
<style>
svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d8dee4;--ink:#1f2328;--muted:#59636e;--soft:#8c959f;--tint:.09;
--laravel:#f0503c;--vue:#10b981;--pg:#3b82f6;--ai:#8b5cf6;--mail:#f59e0b;--ops:#14b8a6;--slate:#64748b;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--soft:#656c76;--tint:.16}}
.card{fill:var(--bg);stroke:var(--line)}
.panel{fill:var(--panel);stroke:var(--line);stroke-dasharray:4 4}
.h{font-size:15px;font-weight:700;fill:var(--ink)}
.t{font-size:14px;font-weight:650;fill:var(--ink)}
.s{font-size:12px;fill:var(--muted)}
.cap{font-size:11px;font-weight:700;letter-spacing:.14em;fill:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.node{fill:var(--c);fill-opacity:var(--tint);stroke:var(--c);stroke-width:1.4;stroke-opacity:.85}
.bar{fill:var(--c)}
.dot{fill:var(--c)}
.flow{fill:none;stroke:var(--soft);stroke-width:1.5;stroke-dasharray:5 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.head{fill:var(--soft)}
.pk{fill:var(--c)}
.glow{animation:glow 3.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.flow,.glow{animation:none}.pk,.motion{display:none}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
<clipPath id="clip"><rect x="1" y="1" width="958" height="358" rx="16"/></clipPath>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="var(--line)" stroke-width="1" opacity=".55"/></pattern>
<radialGradient id="glowA"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#f0503c" stop-opacity=".22"/><stop offset="1" stop-color="#f0503c" stop-opacity="0"/></radialGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a3d"/><stop offset="1" stop-color="#e5242c"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
<stop offset="0" stop-color="#f0503c"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;420 0" dur="8s" repeatCount="indefinite"/></linearGradient></defs>
<rect class="card" x="0.5" y="0.5" width="959" height="359" rx="16"/>
<g clip-path="url(#clip)"><rect width="960" height="360" fill="url(#grid)"/><circle class="glow" cx="790" cy="40" r="240" fill="url(#glowA)"/><circle class="glow" style="animation-delay:-1.8s" cx="90" cy="380" r="230" fill="url(#glowB)"/></g>
<g style="--c:var(--laravel)"><circle class="dot" cx="54" cy="70" r="4"/></g>
<text class="cap" x="66" y="74">STARTER KIT · CÓDIGO ABIERTO · MIT</text>
<text x="48" y="128" style="font-size:46px;font-weight:800;fill:var(--ink);letter-spacing:-.02em">Laravel Starter</text>
<text x="49" y="172" style="font-size:28px;font-weight:700;letter-spacing:-.01em" fill="url(#accent)">con IA lista para producción</text>
<text class="s" x="49" y="210" style="font-size:15px">Laravel 13 · Laravel AI SDK · Vue 3 + Inertia · PostgreSQL + pgvector</text>
<text class="s" x="49" y="232" style="font-size:15px">Un comando para instalar · Docker en local · Dokploy en producción</text>
<g style="--c:var(--ai)"><rect class="node" x="48" y="262" width="148" height="30" rx="15"/><circle class="dot" cx="64" cy="277" r="4"/><text class="t" x="75" y="282" style="font-size:13px">Agentes y costos</text></g>
<g style="--c:var(--pg)"><rect class="node" x="205.6" y="262" width="126" height="30" rx="15"/><circle class="dot" cx="221.6" cy="277" r="4"/><text class="t" x="232.6" y="282" style="font-size:13px">RAG con citas</text></g>
<g style="--c:var(--mail)"><rect class="node" x="341.9" y="262" width="155" height="30" rx="15"/><circle class="dot" cx="357.9" cy="277" r="4"/><text class="t" x="368.9" y="282" style="font-size:13px">Correo automático</text></g>
<g style="--c:var(--laravel)"><rect class="node" x="48" y="302" width="155" height="30" rx="15"/><circle class="dot" cx="64" cy="317" r="4"/><text class="t" x="75" y="322" style="font-size:13px">Roles y auditoría</text></g>
<g style="--c:var(--ops)"><rect class="node" x="212.7" y="302" width="148" height="30" rx="15"/><circle class="dot" cx="228.7" cy="317" r="4"/><text class="t" x="239.7" y="322" style="font-size:13px">API + cliente TS</text></g>
<g style="--c:var(--vue)"><rect class="node" x="370.29999999999995" y="302" width="98" height="30" rx="15"/><circle class="dot" cx="386.29999999999995" cy="317" r="4"/><text class="t" x="397.29999999999995" y="322" style="font-size:13px">Kit de UI</text></g>
<circle cx="770" cy="182" r="152" fill="none" stroke="var(--line)" stroke-dasharray="1 7" stroke-linecap="round" stroke-width="2"/>
<g><circle cx="770" cy="182" r="118" fill="none" stroke="var(--line)" stroke-dasharray="6 8" stroke-width="1.5"/><animateTransform attributeName="transform" type="rotate" from="0 770 182" to="360 770 182" dur="60s" repeatCount="indefinite"/></g>
<path class="flow" d="M770.0,64.0 L770,182"/>
<path class="flow" d="M882.2,145.5 L770,182"/>
<path class="flow" d="M839.4,277.5 L770,182"/>
<path class="flow" d="M700.6,277.5 L770,182"/>
<path class="flow" d="M657.8,145.5 L770,182"/>
<circle class="pk" r="3.5" style="--c:var(--ai)" cx="0" cy="0"><animateMotion dur="2.6s" begin="-0.0s" repeatCount="indefinite" path="M770.0,64.0 L770,182"/></circle>
<circle class="pk" r="3.5" style="--c:var(--pg)" cx="0" cy="0"><animateMotion dur="2.6s" begin="-0.52s" repeatCount="indefinite" path="M882.2,145.5 L770,182"/></circle>
<circle class="pk" r="3.5" style="--c:var(--mail)" cx="0" cy="0"><animateMotion dur="2.6s" begin="-1.04s" repeatCount="indefinite" path="M839.4,277.5 L770,182"/></circle>
<circle class="pk" r="3.5" style="--c:var(--ops)" cx="0" cy="0"><animateMotion dur="2.6s" begin="-1.56s" repeatCount="indefinite" path="M700.6,277.5 L770,182"/></circle>
<circle class="pk" r="3.5" style="--c:var(--vue)" cx="0" cy="0"><animateMotion dur="2.6s" begin="-2.08s" repeatCount="indefinite" path="M657.8,145.5 L770,182"/></circle>
<circle class="motion" cx="770" cy="182" r="56" fill="none" stroke="var(--laravel)" stroke-width="2"><animate attributeName="r" values="52;86" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0" dur="2.8s" repeatCount="indefinite"/></circle>
<rect x="720" y="132" width="100" height="100" rx="24" fill="url(#core)"/>
<text x="770" y="178" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#fff">Laravel 13</text>
<text x="770" y="199" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#fff;opacity:.9">+ laravel/ai</text>
<g style="--c:var(--ai)"><circle cx="770.0" cy="64.0" r="31" fill="var(--bg)"/><circle class="node" cx="770.0" cy="64.0" r="31"/><text class="t" x="770.0" y="69.0" text-anchor="middle" style="font-size:13px">IA</text></g>
<g style="--c:var(--pg)"><circle cx="882.2" cy="145.5" r="31" fill="var(--bg)"/><circle class="node" cx="882.2" cy="145.5" r="31"/><text class="t" x="882.2" y="150.5" text-anchor="middle" style="font-size:13px">RAG</text></g>
<g style="--c:var(--mail)"><circle cx="839.4" cy="277.5" r="31" fill="var(--bg)"/><circle class="node" cx="839.4" cy="277.5" r="31"/><text class="t" x="839.4" y="282.5" text-anchor="middle" style="font-size:13px">Correo</text></g>
<g style="--c:var(--ops)"><circle cx="700.6" cy="277.5" r="31" fill="var(--bg)"/><circle class="node" cx="700.6" cy="277.5" r="31"/><text class="t" x="700.6" y="282.5" text-anchor="middle" style="font-size:13px">API</text></g>
<g style="--c:var(--vue)"><circle cx="657.8" cy="145.5" r="31" fill="var(--bg)"/><circle class="node" cx="657.8" cy="145.5" r="31"/><text class="t" x="657.8" y="150.5" text-anchor="middle" style="font-size:13px">UI</text></g>
</svg>
