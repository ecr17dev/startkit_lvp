<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 318" width="960" height="318" role="img" aria-labelledby="title desc">
<title id="title">Correo: plantillas, automatizaciones y envíos</title>
<desc id="desc">Las plantillas alimentan cuatro disparadores (bienvenida, inactividad, envío programado y eventos del sistema); cada correo es una fila de mail_deliveries con clave única que la cola entrega al proveedor y queda en Envíos.</desc>
<style>
svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d8dee4;--ink:#1f2328;--muted:#59636e;--soft:#8c959f;--tint:.09;
--laravel:#f0503c;--vue:#10b981;--pg:#3b82f6;--ai:#8b5cf6;--mail:#f59e0b;--ops:#14b8a6;--slate:#64748b;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--soft:#656c76;--tint:.16}}
.card{fill:var(--bg);stroke:var(--line)}
.panel{fill:var(--panel);stroke:var(--line);stroke-dasharray:4 4}
.h{font-size:15px;font-weight:700;fill:var(--ink)}
.t{font-size:14px;font-weight:650;fill:var(--ink)}
.s{font-size:12px;fill:var(--muted)}
.cap{font-size:11px;font-weight:700;letter-spacing:.14em;fill:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.node{fill:var(--c);fill-opacity:var(--tint);stroke:var(--c);stroke-width:1.4;stroke-opacity:.85}
.bar{fill:var(--c)}
.dot{fill:var(--c)}
.flow{fill:none;stroke:var(--soft);stroke-width:1.5;stroke-dasharray:5 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.head{fill:var(--soft)}
.pk{fill:var(--c)}
.glow{animation:glow 3.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.flow,.glow{animation:none}.pk,.motion{display:none}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="card" x="0.5" y="0.5" width="959" height="317" rx="16"/>
<path class="flow" d="M242,118 C266,118 266,70 288,70"/>
<path class="flow" d="M482,70 C506,70 506,140 528,140" marker-end="url(#arrow)"/>
<path class="flow" d="M242,118 C266,118 266,112 288,112"/>
<path class="flow" d="M482,112 C506,112 506,140 528,140" marker-end="url(#arrow)"/>
<path class="flow" d="M242,118 C266,118 266,154 288,154"/>
<path class="flow" d="M482,154 C506,154 506,140 528,140" marker-end="url(#arrow)"/>
<path class="flow" d="M242,118 C266,118 266,196 288,196"/>
<path class="flow" d="M482,196 C506,196 506,140 528,140" marker-end="url(#arrow)"/>
<path class="flow" d="M710,140 L768,140" marker-end="url(#arrow)"/>
<path class="flow" d="M846,184 L846,210" marker-end="url(#arrow)"/>
<circle class="pk" r="4" style="--c:var(--mail)" cx="0" cy="0"><animateMotion dur="4.6s" begin="0s" repeatCount="indefinite" path="M140,118 C266,118 266,112 290,112 L482,112 C506,112 506,140 532,140 L772,140 L846,140 L846,240"/></circle>
<circle class="pk" r="4" style="--c:var(--vue)" cx="0" cy="0"><animateMotion dur="4.6s" begin="-2.3s" repeatCount="indefinite" path="M140,118 C266,118 266,196 290,196 L482,196 C506,196 506,140 532,140 L772,140 L846,140"/></circle>
<text class="cap" x="40" y="40">PLANTILLAS → AUTOMATIZACIONES → ENVÍOS</text>
<g style="--c:var(--mail)">
<rect x="40" y="62" width="200" height="112" rx="12" fill="var(--bg)"/>
<rect class="node" x="40" y="62" width="200" height="112" rx="12"/>
<rect class="bar" x="54" y="77" width="4" height="16" rx="2"/>
<text class="t" x="66" y="90">Plantillas</text>
<text class="s" x="66" y="110">editor simple o HTML</text>
<text class="s" x="66" y="127">variables y vista previa</text>
<text class="s" x="66" y="144">borrador con IA</text>
</g>
<g style="--c:var(--vue)"><rect x="290" y="54" width="190" height="32" rx="16" fill="var(--bg)"/><rect class="node" x="290" y="54" width="190" height="32" rx="16"/><circle class="dot" cx="308" cy="70" r="4"/><text class="t" x="320" y="75" style="font-size:13px">Bienvenida</text></g>
<g style="--c:var(--vue)"><rect x="290" y="96" width="190" height="32" rx="16" fill="var(--bg)"/><rect class="node" x="290" y="96" width="190" height="32" rx="16"/><circle class="dot" cx="308" cy="112" r="4"/><text class="t" x="320" y="117" style="font-size:13px">Inactividad</text></g>
<g style="--c:var(--vue)"><rect x="290" y="138" width="190" height="32" rx="16" fill="var(--bg)"/><rect class="node" x="290" y="138" width="190" height="32" rx="16"/><circle class="dot" cx="308" cy="154" r="4"/><text class="t" x="320" y="159" style="font-size:13px">Envío programado</text></g>
<g style="--c:var(--vue)"><rect x="290" y="180" width="190" height="32" rx="16" fill="var(--bg)"/><rect class="node" x="290" y="180" width="190" height="32" rx="16"/><circle class="dot" cx="308" cy="196" r="4"/><text class="t" x="320" y="201" style="font-size:13px">Evento del sistema</text></g>
<g style="--c:var(--pg)">
<rect x="532" y="98" width="176" height="84" rx="12" fill="var(--bg)"/>
<rect class="node" x="532" y="98" width="176" height="84" rx="12"/>
<rect class="bar" x="546" y="113" width="4" height="16" rx="2"/>
<text class="t mono" x="558" y="126">mail_deliveries</text>
<text class="s" x="558" y="146">una fila por envío</text>
<text class="s" x="558" y="163">clave única, sin repetir</text>
</g>
<g style="--c:var(--slate)">
<rect x="772" y="98" width="148" height="84" rx="12" fill="var(--bg)"/>
<rect class="node" x="772" y="98" width="148" height="84" rx="12"/>
<rect class="bar" x="786" y="113" width="4" height="16" rx="2"/>
<text class="t" x="798" y="126">Proveedor</text>
<text class="s" x="798" y="146">Resend · SMTP</text>
<text class="s" x="798" y="163">Postmark · Mailgun</text>
</g>
<text class="s mono" x="740" y="130" text-anchor="middle" style="font-size:10.5px">cola mail</text>
<g style="--c:var(--mail)">
<rect x="532" y="214" width="388" height="62" rx="12" fill="var(--bg)"/>
<rect class="node" x="532" y="214" width="388" height="62" rx="12"/>
<rect class="bar" x="546" y="229" width="4" height="16" rx="2"/>
<text class="t" x="558" y="242">Envíos</text>
<text class="s" x="558" y="262">pendiente · enviado · fallido · omitido · reintentar</text>
</g>
<text class="s" x="40" y="214">Códigos de acceso, invitaciones y</text>
<text class="s" x="40" y="232">recuperación de contraseña usan las</text>
<text class="s" x="40" y="250">mismas plantillas, editables por idioma.</text>
<text class="s" x="40" y="298">{{ variable }} se reemplaza escapada y nunca se compila como Blade · el HTML pierde scripts y manejadores de eventos</text>
</svg>
